name: PILAR Storefront Admin Verification
on:
  push:
    branches: [cloudflare-pages]
    paths:
      - 'storefront*.js'
      - 'store-pro.js'
      - 'store-seo.js'
      - 'admin*.js'
      - 'router.js'
      - 'index.html'
      - 'robots.txt'
      - 'tests/storefront-admin-sync.mjs'
      - 'tests/feature-check.mjs'
      - 'tests/hero-icons-image-stable.mjs'
      - 'tests/hero-refresh-race.mjs'
      - 'tests/hero-splash-regression.mjs'
      - 'tests/hero-stable-rollback.mjs'
      - 'tests/hero-watch-cache-regression.mjs'
      - 'tests/hero-watch-only-change.mjs'
      - 'tests/mobile-hero-layout.mjs'
      - 'storefront-reference-hero.js'
      - 'storefront-reference-hero.css'
      - 'tests/hero-stable-rollback.mjs'
      - '.github/workflows/storefront-admin-check.yml'
  pull_request:
    branches: [cloudflare-pages]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in storefront.js storefront-state.js storefront-realtime.js store-pro.js store-seo.js store-gender-filter.js admin-v2.js admin-realtime.js admin-product-save-v2.js router.js; do
            test ! -f "$f" || node --check "$f"
          done
      - name: Storefront/admin synchronization contract
        run: |
          node --check tests/storefront-admin-sync.mjs
          node tests/storefront-admin-sync.mjs
          for t in tests/*.mjs; do
            case "$t" in
              tests/mobile-hero-final-reference.mjs|tests/mobile-hero-reference.mjs|tests/android-*.mjs) echo "Skipping non-storefront contract $t";;
              *) echo "Running $t"; node "$t";;
            esac
          done
