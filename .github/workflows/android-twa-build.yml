name: PILAR Android TWA Build

on:
  push:
    branches: [cloudflare-pages]
    paths:
      - 'android-twa/**'
      - 'tests/android-twa-structure.mjs'
      - '.github/workflows/android-twa-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Android project contract
        run: |
          node tests/android-twa-structure.mjs
          node tests/android-gradle-config.mjs
          node tests/android-sdk-compat.mjs
          node tests/android-gradle-version.mjs
          node tests/android-keystore-safety.mjs
          node tests/android-assetlinks.mjs
          node tests/android-twa-identity.mjs
          node tests/android-download-button.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Export Android apksigner tool
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          mkdir -p /tmp/pilar-apksigner-tool
          cp "$APKSIGNER" /tmp/pilar-apksigner-tool/apksigner
          APKSIGNER_JAR="$(dirname "$APKSIGNER")/lib/apksigner.jar"
          test -f "$APKSIGNER_JAR"
          mkdir -p /tmp/pilar-apksigner-tool/lib
          cp "$APKSIGNER_JAR" /tmp/pilar-apksigner-tool/lib/apksigner.jar

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: pilar-apksigner-tool
          if-no-files-found: error
          path: /tmp/pilar-apksigner-tool

      - name: Build unsigned release APK and AAB
        working-directory: android-twa
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pilar-android-unsigned
          if-no-files-found: error
          path: |
            android-twa/app/build/outputs/apk/release/*.apk
            android-twa/app/build/outputs/bundle/release/*.aab
